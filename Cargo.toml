[workspace]
resolver = "2"
members = [
    "crates/ares-cli",
    "crates/ares-core",
    "crates/ares-net",
    "crates/ares-proto",
    "crates/ares-probe",
    "crates/ares-output",
    "crates/ares-plugin-api",
    "crates/ares-modules",
    "crates/ares-plugin-hello",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["g0dux"]
repository = "https://github.com/g0dux/AresBird"

[workspace.dependencies]
ares-core = { path = "crates/ares-core" }
ares-net = { path = "crates/ares-net" }
ares-proto = { path = "crates/ares-proto" }
ares-probe = { path = "crates/ares-probe" }
ares-output = { path = "crates/ares-output" }
ares-plugin-api = { path = "crates/ares-plugin-api" }
ares-modules = { path = "crates/ares-modules" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"
comfy-table = "7"
ratatui = "0.29"
crossterm = "0.28"
ipnet = "2"
hickory-resolver = "0.24"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
bytes = "1"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
regex = "1"
serde_yaml = "0.9"
url = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
libloading = "0.8"
# ring only — aws-lc-sys build scripts are frequently blocked by Windows Smart App Control
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.16"
socket2 = "0.5"
pnet = "0.35"

[profile.release]
# thin LTO: faster/stabler on Windows than fat LTO + codegen-units=1
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true

# Same opts as release, separate artifact dir (`…/dist/`).
# Use when Smart App Control has poisoned `release/build/*` scripts (os error 4551).
[profile.dist]
inherits = "release"
